name: AutoTrade CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "Trading mode"
        required: false
        default: "backtest"
        type: choice
        options:
          - backtest
          - paper

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short
        continue-on-error: true

      - name: Validate agent imports
        run: |
          python -c "
          from agents.orchestrator import AutoTradeOrchestrator
          from agents.memory.agent import MemoryAgent
          from agents.strategy.agent import StrategyAgent
          from agents.risk.agent import RiskAgent
          from agents.execution.agent import ExecutionAgent
          from agents.regime.agent import RegimeAgent
          from agents.monitor.agent import MonitorAgent
          print('✅ All agents import successfully')
          print(f'  {len(dir(AutoTradeOrchestrator))} methods on Orchestrator')
          print(f'  MemoryAgent: ✓')
          print(f'  StrategyAgent: ✓')
          print(f'  RiskAgent: ✓')
          print(f'  ExecutionAgent: ✓')
          print(f'  RegimeAgent: ✓')
          print(f'  MonitorAgent: ✓')
          "

  paper-trade:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run paper trade simulation
        run: |
          python run.py --mode paper --capital 30 --target 100
        env:
          PYTHONUNBUFFERED: 1
